<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atlet Binaan — Coach Syaifudin Wahid</title>
<meta name="description" content="Profil atlet atletik binaan Coach Syaifudin Wahid, M.Pd — sprint, middle distance & long distance.">
<meta name="theme-color" content="#fbf7f1">
<meta property="og:title" content="Atlet Binaan — Coach Syaifudin Wahid">
<meta property="og:description" content="Profil, catatan waktu terbaik & prestasi atlet atletik.">
<meta property="og:image" content="foto/afika.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23b3262d'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='30' font-style='italic' text-anchor='middle' fill='%23fff'%3ESW%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf7f1;--card:#fff;--ink:#1f1416;--mut:#6b5f5a;--line:#eadfd3;--wine:#b3262d;--wine2:#d9454b;--gold:#c08f3e;--gold2:#e8c27a;--sky:#1d4f7a;
  --serif:'Fraunces',Georgia,serif;--sans:'Plus Jakarta Sans',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden;
  background:radial-gradient(800px 500px at 100% -10%,rgba(232,194,122,.32),transparent 60%),radial-gradient(700px 500px at -10% 25%,rgba(217,69,75,.12),transparent 60%),var(--bg)}
a{color:inherit}img{display:block;max-width:100%}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:10px}
.wrap{width:min(560px,100% - 32px);margin:0 auto;padding:18px 0 48px;display:grid;gap:18px}
.wrap.wide{width:min(980px,100% - 32px)}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.015em;margin:0;line-height:1.1}
em{font-style:italic;color:var(--wine)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.back{display:inline-flex;align-items:center;gap:.5rem;text-decoration:none;font-weight:700;font-size:.9rem;padding:.5rem .9rem;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.back:hover{border-color:var(--gold2)}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);cursor:pointer;font-size:1.05rem}
.kicker{display:inline-flex;align-items:center;gap:.55rem;font-size:.72rem;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.kicker:before,.kicker:after{content:"";width:22px;height:1px;background:currentColor}
.sec{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;font-weight:800;color:var(--gold);margin:10px 4px -6px;display:flex;align-items:center;gap:.6rem}
.sec:after{content:"";flex:1;height:1px;background:var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 28px -24px rgba(60,20,20,.6)}
/* hero */
.hero{display:grid;gap:16px;justify-items:center;text-align:center}
.photo{position:relative;width:min(260px,70vw);aspect-ratio:1/1.35;border-radius:28px;padding:5px;background:linear-gradient(150deg,var(--gold2),var(--wine) 55%,#1d4f7a);box-shadow:0 30px 60px -30px rgba(120,20,30,.7);animation:float 6s ease-in-out infinite}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;border-radius:23px}
.photo .tag{position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);white-space:nowrap;padding:.4rem .9rem;border-radius:999px;background:var(--ink);color:#fff;font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;box-shadow:0 10px 20px -10px #000}
@keyframes float{50%{transform:translateY(-6px) rotate(-.6deg)}}
.hero h1{font-size:clamp(2rem,8vw,2.7rem);margin-top:14px}
.meta{display:flex;flex-wrap:wrap;justify-content:center;gap:.4rem}
.meta span{padding:.35rem .8rem;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:.8rem;font-weight:600;color:var(--mut)}
.events{display:flex;gap:.5rem;justify-content:center}
.events b{padding:.45rem 1rem;border-radius:12px;background:linear-gradient(135deg,var(--wine),var(--wine2));color:#fff;font:700 1rem var(--mono);letter-spacing:.02em}
/* PB */
.pbs{display:grid;gap:10px}
@media(min-width:460px){.pbs{grid-template-columns:repeat(2,1fr)}}
.pb{position:relative;overflow:hidden;padding:16px 16px 14px;border-radius:22px;background:linear-gradient(160deg,#1f1416,#3a1a1e);color:#fff}
.pb:after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;border:10px solid rgba(232,194,122,.16)}
.pb small{display:block;font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold2);font-weight:800}
.pb .t{font:700 2.6rem/1.05 var(--mono);letter-spacing:-.02em;margin:.25rem 0}
.pb .e{font-size:.8rem;opacity:.85}
/* medali */
.tally{display:flex;justify-content:center;gap:10px}
.tally div{flex:1;max-width:140px;text-align:center;padding:12px 8px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.tally b{display:block;font:600 1.8rem/1 var(--serif)}
.tally small{font-size:.72rem;color:var(--mut);font-weight:700}
.coin{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;font-weight:800;font-size:.95rem;color:#fff;flex:none;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15),0 8px 16px -8px rgba(0,0,0,.4)}
.coin.gold{background:radial-gradient(circle at 35% 30%,#ffe9a8,#d9a520 60%,#a87a10)}
.coin.silver{background:radial-gradient(circle at 35% 30%,#ffffff,#b9c2cc 60%,#8a949f)}
.coin.bronze{background:radial-gradient(circle at 35% 30%,#ffd2a6,#c9772f 60%,#8f4f1c)}
.coin.none{background:var(--line);color:var(--mut)}
.ach{list-style:none;margin:0;padding:6px 16px}
.ach li{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px dashed var(--line)}
.ach li:first-child{border-top:0}
.ach div{flex:1;min-width:0}
.ach b{display:block;font:600 1.02rem/1.25 var(--serif)}
.ach small{color:var(--mut);font-size:.82rem}
.ach .yr{font:700 .8rem var(--mono);color:var(--gold);padding:.2rem .5rem;border-radius:8px;background:#fff6e6}
/* target */
.road{padding:16px;display:grid;gap:14px}
.road h3{font-size:1.15rem}
.goal .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:700}
.goal .row span{font:700 .95rem var(--mono)}
.goal .bar{position:relative;height:12px;border-radius:99px;background:#f2e8dc;margin:.45rem 0 .3rem;overflow:hidden}
.goal .bar i{position:absolute;inset:0 auto 0 0;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--gold2),var(--wine));transition:width 1.6s cubic-bezier(.2,.8,.2,1)}
.goal small{color:var(--mut);font-size:.8rem}
.goal small b{color:var(--wine)}
/* motto */
.quote{padding:20px 18px;text-align:center;background:linear-gradient(150deg,#fff,#fdf1e4)}
.quote q{display:block;font:italic 500 1.25rem/1.4 var(--serif);quotes:"“" "”"}
.quote small{display:block;margin-top:.6rem;color:var(--mut);font-weight:600}
.socials{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.socials a{display:inline-flex;align-items:center;gap:.5rem;min-height:46px;padding:.55rem 1.1rem;border-radius:999px;text-decoration:none;font-weight:700;color:#fff}
.ig{background:linear-gradient(135deg,#f58529,#dd2a7b 50%,#8134af)}.tt{background:#111}
.coachby{display:flex;align-items:center;gap:12px;padding:14px 16px;text-decoration:none}
.coachby img{width:48px;height:48px;border-radius:14px;object-fit:cover;object-position:50% 15%;background:#c3262e}
.coachby div{flex:1}.coachby small{display:block;color:var(--mut);font-size:.78rem}
/* roster */
.roster{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.ath{display:block;text-decoration:none;overflow:hidden;transition:transform .25s,box-shadow .25s}
.ath:hover{transform:translateY(-4px);box-shadow:0 20px 34px -22px rgba(60,20,20,.6)}
.ath .im{aspect-ratio:4/5;overflow:hidden;background:#f2e8dc}
.ath img{width:100%;height:100%;object-fit:cover;object-position:50% 10%;transition:transform .5s}
.ath:hover img{transform:scale(1.04)}
.ath .bd{padding:12px 14px}
.ath b{display:block;font:600 1.1rem var(--serif)}
.ath small{color:var(--mut);font-size:.82rem}
.ath .ev{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.ath .ev span{font:700 .75rem var(--mono);padding:.15rem .5rem;border-radius:8px;background:#fdecea;color:var(--wine)}
footer{text-align:center;color:var(--mut);font-size:.8rem}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);background:var(--ink);color:#fff;padding:.7rem 1.2rem;border-radius:999px;font-weight:600;font-size:.88rem;transition:transform .35s;z-index:50}
.toast.on{transform:translate(-50%,0)}
.js .rv{opacity:0;transform:translateY(24px);filter:blur(6px);transition:opacity .9s ease,transform 1s cubic-bezier(.2,.7,.1,1),filter .9s ease;transition-delay:var(--d,0s)}
.js .rv.in{opacity:1;transform:none;filter:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.js .rv{opacity:1;transform:none;filter:none}}
</style>
</head>
<body>
<script>document.documentElement.classList.add('js')</script>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite">Link copied ✓</div>
<script src="data.js?v=1"></script>
<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = d => { const m = Math.floor(d / 60), s = d - m * 60; return m ? `${m}:${s.toFixed(s % 1 ? 2 : 0).padStart(s % 1 ? 5 : 2, '0')}` : s.toFixed(2); };
const MED = { gold: '1', silver: '2', bronze: '3' };
const app = document.getElementById('app');
const id = new URLSearchParams(location.search).get('a');
const A = (window.ATLET || []).find(x => x.id === id);
const coach = `<a class="card coachby rv" href="https://syaifudinwahid.vercel.app/" target="_blank" rel="noopener"><img src="assets/wahid-cutout.webp" alt=""><div><b>Coached by Coach Syaifudin Wahid, M.Pd</b><small>Swimming &amp; Athletics Coach · PASI Kota Tangerang</small></div><span aria-hidden="true">→</span></a>`;

if (A) {
  document.title = `${A.nama} — Atlet ${A.kategori} | Coach Syaifudin Wahid`;
  const medals = { gold: 0, silver: 0, bronze: 0 }; A.prestasi.forEach(p => medals[p.medali] !== undefined && medals[p.medali]++);
  const age = new Date().getFullYear() - A.lahir;
  app.innerHTML = `<div class="wrap">
    <div class="top"><a class="back" href="./">← Semua atlet</a><button class="iconbtn" id="share" aria-label="Bagikan profil">↗</button></div>
    <header class="hero rv">
      <div class="photo"><img src="${esc(A.foto)}" alt="${esc(A.nama)}" width="480" height="960"><span class="tag">${esc(A.kategori)}</span></div>
      <span class="kicker" style="margin-top:12px">Athlete · ${esc(A.klub)}</span>
      <h1>${esc(A.nama.replace(A.panggilan, '').trim()) ? esc(A.nama).replace(esc(A.panggilan), `<em>${esc(A.panggilan)}</em>`) : esc(A.nama)}</h1>
      <div class="meta"><span>${esc(A.gender)} · ${age} tahun</span><span>📍 ${esc(A.kota)}</span><span>🏫 ${esc(A.sekolah)}</span><span>🏃 Sejak ${esc(A.sejak)}</span></div>
      <div class="events">${A.nomor.map(n => `<b>${esc(n)}</b>`).join('')}</div>
    </header>

    <div class="sec rv">Personal best</div>
    <div class="pbs">${A.pb.map(p => `<div class="pb rv"><small>${esc(p.nomor)}</small><div class="t" data-sec="${p.detik}">${esc(p.tampil)}</div><div class="e">${esc(p.event)} · ${esc(p.tempat)} · ${p.tahun}</div></div>`).join('')}</div>

    <div class="sec rv">Achievements</div>
    <div class="tally rv"><div><b>🥇 ${medals.gold}</b><small>Emas</small></div><div><b>🥈 ${medals.silver}</b><small>Perak</small></div><div><b>🥉 ${medals.bronze}</b><small>Perunggu</small></div></div>
    <ol class="card ach rv">${A.prestasi.map(p => `<li><span class="coin ${p.medali || 'none'}">${MED[p.medali] || '★'}</span><div><b>${esc(p.event)}</b><small>${esc(p.nomor)} · ${esc(p.hasil)}</small></div><span class="yr">${p.tahun}</span></li>`).join('')}</ol>

    ${A.target ? `<div class="sec rv">Road to ${esc(A.target.event)}</div>
    <div class="card road rv">${A.target.waktu.map(g => { const gap = g.dari - g.ke; return `<div class="goal"><div class="row"><b>${esc(g.nomor)}</b><span>${fmt(g.dari)} → <b style="color:var(--wine)">${esc(g.tampil)}</b></span></div><div class="bar"><i data-w="${Math.round(g.ke / g.dari * 100)}"></i></div><small>Target: pangkas <b>${gap % 1 ? gap.toFixed(2) : gap} detik</b> dari catatan terbaik</small></div>`; }).join('')}</div>` : ''}

    <div class="card quote rv"><q>${esc(A.motto)}</q><small>— ${esc(A.panggilan)} · Idola: ${esc(A.idola)}</small></div>
    <div class="socials rv">${A.instagram ? `<a class="ig" href="https://instagram.com/${esc(A.instagram)}" target="_blank" rel="noopener">📷 @${esc(A.instagram)}</a>` : ''}${A.tiktok ? `<a class="tt" href="https://www.tiktok.com/@${esc(A.tiktok)}" target="_blank" rel="noopener">🎵 @${esc(A.tiktok)}</a>` : ''}</div>
    ${coach}
    <footer>© ${new Date().getFullYear()} Coach Syaifudin Wahid · Profil atlet ditampilkan dengan izin</footer>
  </div>`;
} else {
  const list = window.ATLET || [];
  app.innerHTML = `<div class="wrap wide">
    <div class="top"><a class="back" href="https://syaifudinwahid.vercel.app/">← Coach Syaifudin Wahid</a><button class="iconbtn" id="share" aria-label="Bagikan halaman">↗</button></div>
    <header class="hero rv" style="margin:10px 0 6px"><span class="kicker">Athletics · Sprint &amp; Distance</span><h1>Our <em>Athletes</em></h1><p style="margin:0;color:var(--mut);max-width:520px">Atlet atletik binaan Coach Syaifudin Wahid — sprint, middle distance &amp; long distance.</p></header>
    <div class="roster">${list.map(a => { const best = a.prestasi.find(p => p.medali) || {}; return `<a class="card ath rv" href="?a=${esc(a.id)}"><div class="im"><img src="${esc(a.foto)}" alt="${esc(a.nama)}" loading="lazy" width="480" height="960"></div><div class="bd"><b>${esc(a.nama)}</b><small>${esc(a.klub)} · ${esc(a.kategori)}</small><div class="ev">${a.nomor.map(n => `<span>${esc(n)}</span>`).join('')}${best.hasil ? `<span style="background:#fff6e6;color:#a8741d">🏅 ${esc(best.event)}</span>` : ''}</div></div></a>`; }).join('')}</div>
    ${coach}
  </div>`;
}

// animasi: muncul saat digulir, bar target terisi, angka PB berputar
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => { let k = 0; es.filter(e => e.isIntersecting).forEach(e => {
  e.target.style.setProperty('--d', (k++ * .08).toFixed(2) + 's'); e.target.classList.add('in'); io.unobserve(e.target);
  e.target.querySelectorAll('.bar i').forEach(i => setTimeout(() => i.style.width = i.dataset.w + '%', 400));
  e.target.querySelectorAll('.t[data-sec]').forEach(t => { if (reduce) return; const end = +t.dataset.sec, txt = t.textContent, t0 = performance.now(); (function f(n) { const p = Math.min(1, (n - t0) / 1100), v = end * (1 - Math.pow(1 - p, 3)); t.textContent = p < 1 ? fmt(v) : txt; if (p < 1) requestAnimationFrame(f); })(t0); });
}); }, { threshold: .12 }) : null;
document.querySelectorAll('.rv').forEach(el => io ? io.observe(el) : el.classList.add('in'));
if (!io) document.querySelectorAll('.bar i').forEach(i => i.style.width = i.dataset.w + '%');
// pengaman: tampilkan isi yang terlihat walau animasi tertahan
setTimeout(() => document.querySelectorAll('.rv:not(.in)').forEach(el => { if (el.getBoundingClientRect().top < innerHeight) { el.classList.add('in'); el.querySelectorAll('.bar i').forEach(i => i.style.width = i.dataset.w + '%'); } }), 2500);

const toast = document.getElementById('toast');
document.getElementById('share').onclick = async () => {
  const data = { title: document.title, url: location.href };
  try { if (navigator.share) return await navigator.share(data); await navigator.clipboard.writeText(location.href); toast.classList.add('on'); setTimeout(() => toast.classList.remove('on'), 2000); } catch { }
};
</script>
</body>
</html>
